name: RM - Supabase local aislado (sin LIVE)
on:
  push:
    branches:
      - work/rm-launch-audit-2026
    paths:
      - .github/workflows/rm-staging-local.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rm-staging-local
  cancel-in-progress: false

jobs:
  verify-local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PAYMENT_ENV: test
      EMAIL_ENV: test
      GUMROAD_ENV: test
      PAYMENTS_ENABLED: 'false'
      GUMROAD_ENABLED: 'false'
      PUBLIC_SITE_URL: http://127.0.0.1:5173
      TEST_BUYER_EMAILS: rm-ci-free@example.invalid,rm-ci-kit@example.invalid,rm-ci-program@example.invalid
      MP_ACCESS_TOKEN: TEST-LOCAL-ONLY
      NODE_ENV: test
    steps:
      - name: Checkout only the audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Verify existing isolated backend rules
        run: npm test

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start disposable Supabase local (never link a remote project)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rm-supabase"
          cd "$RUNNER_TEMP/rm-supabase"
          supabase init --yes
          supabase start
          supabase status -o env > "$RUNNER_TEMP/rm-supabase-local.env"
          chmod 600 "$RUNNER_TEMP/rm-supabase-local.env"

      - name: Apply baseline ONLY to local empty database
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:staging
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/staging/bootstrap.sql >/dev/null
          echo "Isolated bootstrap applied to 127.0.0.1 only"

      - name: Run authenticated local Supabase API / RLS / continuity tests
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/rm-supabase-local.env"
          set +a
          export SUPABASE_URL="${API_URL:-}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-}"
          test "$SUPABASE_URL" = "http://127.0.0.1:54321"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          npm run check:staging
          npm run test:staging

      - name: Clarify coverage
        if: always()
        run: |
          echo "### RM — staging local aislado" >> "$GITHUB_STEP_SUMMARY"
          echo "Este flujo no usa secretos de GitHub ni toca proyectos Supabase alojados." >> "$GITHUB_STEP_SUMMARY"
          echo "MP / Gumroad / Resend auténticos, email externo e iPhone físico: **NO PROBADOS**." >> "$GITHUB_STEP_SUMMARY"
          echo "El resultado corresponde solo a SQL/Auth/PostgREST/RLS locales y tests del repositorio." >> "$GITHUB_STEP_SUMMARY"
